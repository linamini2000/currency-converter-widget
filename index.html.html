<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f8;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 transition-all duration-300">
        
        <!-- Header Banner -->
        <div class="bg-[#38332e] text-white text-center py-4 px-6">
            <h1 class="serif-font text-2xl font-bold tracking-wide">Currency Converter</h1>
        </div>

        <!-- Widget Body -->
        <div class="p-6 space-y-5">

            <!-- Amount Input -->
            <div class="space-y-1.5">
                <label for="amount" class="block serif-font font-bold text-gray-900 text-base">Amount</label>
                <input type="number" id="amount" value="1" step="any"
                    class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 text-base focus:outline-none focus:ring-2 focus:ring-[#38332e] focus:border-transparent transition">
            </div>

            <!-- From Currency -->
            <div class="space-y-1.5">
                <label for="fromCurrency" class="block serif-font font-bold text-gray-900 text-base">From Currency</label>
                <div class="relative">
                    <select id="fromCurrency"
                        class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 text-base appearance-none focus:outline-none focus:ring-2 focus:ring-[#38332e] focus:border-transparent transition cursor-pointer">
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-700">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <!-- To Currency -->
            <div class="space-y-1.5">
                <label for="toCurrency" class="block serif-font font-bold text-gray-900 text-base">To Currency</label>
                <div class="relative">
                    <select id="toCurrency"
                        class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 text-base appearance-none focus:outline-none focus:ring-2 focus:ring-[#38332e] focus:border-transparent transition cursor-pointer">
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-700">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Swap Button -->
            <button id="swapBtn"
                class="w-full py-3 px-4 bg-[#f1f1f0] hover:bg-[#e4e4e2] text-gray-900 serif-font font-bold rounded-xl transition flex items-center justify-center space-x-2 shadow-sm">
                <span>↕</span>
                <span>Swap Currencies</span>
            </button>

            <!-- Result Box -->
            <div id="resultBox" class="bg-[#f7f7f6] border border-gray-100 rounded-2xl p-5 text-center space-y-2">
                <div id="rateText" class="text-xs text-gray-500 font-medium">1 EUR = 1.6148 CAD</div>
                <div id="convertedAmount" class="serif-font text-2xl sm:text-3xl font-bold text-gray-900">1.61 CAD</div>
                <div id="timestamp" class="text-[10px] text-gray-400">Last updated: Loading...</div>
            </div>

        </div>
    </div>

    <div class="mt-8 w-full max-w-sm bg-white rounded-xl p-5 border border-gray-200 shadow-sm text-sm text-gray-700">
        <h2 class="serif-font font-bold text-gray-900 text-base mb-2">📌 How to Embed in Notion</h2>
        <ol class="list-decimal list-inside space-y-1.5 text-xs text-gray-600 mb-4">
            <li>Host this HTML file on a free static host (e.g., <a href="https://pages.github.com/" target="_blank" class="text-blue-600 underline">GitHub Pages</a>, <a href="https://netlify.com" target="_blank" class="text-blue-600 underline">Netlify Drop</a>, or CodePen).</li>
            <li>Copy the public URL of your hosted widget page.</li>
            <li>In Notion, type <code class="bg-gray-100 px-1 py-0.5 rounded text-gray-800">/embed</code> and paste the link!</li>
        </ol>
        <button id="copyCodeBtn" class="w-full py-2 bg-gray-900 text-white font-medium rounded-lg hover:bg-gray-800 transition text-xs">
            Copy HTML Code for Hosting
        </button>
    </div>

    <script>
        // Currency list with fallback rates relative to USD incase of network issue
        const popularCurrencies = [
            "USD", "EUR", "GBP", "CAD", "AUD", "JPY", "CHF", "CNY", "INR", "NZD", 
            "SGD", "HKD", "KRW", "MXN", "BRL", "ZAR", "SEK", "NOK", "DKK", "PLN"
        ];

        const currencyNames = {
            USD: "US Dollar", EUR: "Euro", GBP: "British Pound", CAD: "Canadian Dollar",
            AUD: "Australian Dollar", JPY: "Japanese Yen", CHF: "Swiss Franc", CNY: "Chinese Yuan",
            INR: "Indian Rupee", NZD: "New Zealand Dollar", SGD: "Singapore Dollar", HKD: "Hong Kong Dollar",
            KRW: "South Korean Won", MXN: "Mexican Peso", BRL: "Brazilian Real", ZAR: "South African Rand",
            SEK: "Swedish Krona", NOK: "Norwegian Krone", DKK: "Danish Krone", PLN: "Polish Zloty"
        };

        let ratesCache = {};
        let lastUpdatedTime = "";

        const amountInput = document.getElementById('amount');
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const swapBtn = document.getElementById('swapBtn');
        const rateText = document.getElementById('rateText');
        const convertedAmountEl = document.getElementById('convertedAmount');
        const timestampEl = document.getElementById('timestamp');
        const copyCodeBtn = document.getElementById('copyCodeBtn');

        // Populate select options
        function initDropdowns() {
            popularCurrencies.sort().forEach(curr => {
                const option1 = document.createElement('option');
                option1.value = curr;
                option1.text = `${curr} - ${currencyNames[curr] || curr}`;
                fromSelect.appendChild(option1);

                const option2 = document.createElement('option');
                option2.value = curr;
                option2.text = `${curr} - ${currencyNames[curr] || curr}`;
                toSelect.appendChild(option2);
            });

            // Default selections matching reference image (EUR to CAD)
            fromSelect.value = "EUR";
            toSelect.value = "CAD";
        }

        // Fetch live rates with robust fallback
        async function fetchExchangeRates(base) {
            try {
                // Using frankfurter.app (free open-source currency API)
                const response = await fetch(`https://api.frankfurter.app/latest?from=${base}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                ratesCache = data.rates;
                ratesCache[base] = 1; // base currency rate is 1
                lastUpdatedTime = data.date ? `${data.date} 00:00:00 UTC` : new Date().toUTCString();
                calculateConversion();
            } catch (error) {
                console.warn("API fetch failed, utilizing fallback rates:", error);
                // Simulated fallback rates based on USD
                ratesCache = {
                    USD: 1.0, EUR: 0.92, GBP: 0.79, CAD: 1.35, AUD: 1.52,
                    JPY: 151.5, CHF: 0.90, CNY: 7.23, INR: 83.3, NZD: 1.65
                };
                lastUpdatedTime = new Date().toUTCString();
                calculateConversion();
            }
        }

        function calculateConversion() {
            const amount = parseFloat(amountInput.value) || 0;
            const from = fromSelect.value;
            const to = toSelect.value;

            if (!ratesCache[from] || !ratesCache[to]) {
                // If cross rates need computation when base is different
                fetchExchangeRates(from);
                return;
            }

            // Convert amount via base rate normalization
            const rateFromBase = ratesCache[from];
            const rateToBase = ratesCache[to];
            const exchangeRate = rateToBase / rateFromBase;

            const converted = amount * exchangeRate;

            rateText.textContent = `1 ${from} = ${exchangeRate.toFixed(4)} ${to}`;
            convertedAmountEl.textContent = `${converted.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} ${to}`;
            timestampEl.textContent = `Last updated: ${lastUpdatedTime}`;
        }

        // Event Listeners
        fromSelect.addEventListener('change', () => {
            fetchExchangeRates(fromSelect.value);
        });

        toSelect.addEventListener('change', () => {
            calculateConversion();
        });

        amountInput.addEventListener('input', calculateConversion);

        swapBtn.addEventListener('click', () => {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            fetchExchangeRates(fromSelect.value);
        });

        copyCodeBtn.addEventListener('click', () => {
            const fullCode = document.documentElement.outerHTML;
            const textarea = document.createElement('textarea');
            textarea.value = fullCode;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                copyCodeBtn.textContent = 'Copied to Clipboard! 🎉';
                setTimeout(() => copyCodeBtn.textContent = 'Copy HTML Code for Hosting', 2500);
            } catch (err) {
                alert('Unable to copy automatically.');
            }
            document.body.removeChild(textarea);
        });

        // Initialize on load
        window.onload = () => {
            initDropdowns();
            fetchExchangeRates(fromSelect.value);
        };
    </script>
</body>
</html>
