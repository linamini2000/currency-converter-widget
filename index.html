<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f8;
            margin: 0;
            padding: 0;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Header Banner -->
        <div class="bg-[#38332e] text-white text-center py-4 px-6">
            <h1 class="serif-font text-2xl font-bold tracking-wide">Currency Converter</h1>
        </div>

        <!-- Widget Body -->
        <div class="p-6 space-y-5">

            <!-- Amount Input -->
            <div class="space-y-1.5">
                <label for="amount" class="block serif-font font-bold text-gray-900 text-base">Amount</label>
                <input type="number" id="amount" value="1" step="any"
                    class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 text-base focus:outline-none focus:ring-2 focus:ring-[#38332e] focus:border-transparent transition">
            </div>

            <!-- From Currency -->
            <div class="space-y-1.5">
                <label for="fromCurrency" class="block serif-font font-bold text-gray-900 text-base">From Currency</label>
                <div class="relative">
                    <select id="fromCurrency"
                        class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 text-base appearance-none focus:outline-none focus:ring-2 focus:ring-[#38332e] focus:border-transparent transition cursor-pointer">
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-700">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <!-- To Currency -->
            <div class="space-y-1.5">
                <label for="toCurrency" class="block serif-font font-bold text-gray-900 text-base">To Currency</label>
                <div class="relative">
                    <select id="toCurrency"
                        class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 text-base appearance-none focus:outline-none focus:ring-2 focus:ring-[#38332e] focus:border-transparent transition cursor-pointer">
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-700">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Swap Button -->
            <button id="swapBtn"
                class="w-full py-3 px-4 bg-[#f1f1f0] hover:bg-[#e4e4e2] text-gray-900 serif-font font-bold rounded-xl transition flex items-center justify-center space-x-2 shadow-sm cursor-pointer">
                <span>↕</span>
                <span>Swap Currencies</span>
            </button>

            <!-- Result Box -->
            <div id="resultBox" class="bg-[#f7f7f6] border border-gray-100 rounded-2xl p-5 text-center space-y-2">
                <div id="rateText" class="text-xs text-gray-500 font-medium">Loading exchange rate...</div>
                <div id="convertedAmount" class="serif-font text-2xl sm:text-3xl font-bold text-gray-900">...</div>
                <div id="timestamp" class="text-[10px] text-gray-400">Fetching live rates...</div>
            </div>

        </div>
    </div>

    <script>
        // Currency dictionary for clear descriptions
        const currencyNames = {
            USD: "US Dollar", EUR: "Euro", GBP: "British Pound", CAD: "Canadian Dollar",
            AUD: "Australian Dollar", JPY: "Japanese Yen", CHF: "Swiss Franc", CNY: "Chinese Yuan",
            INR: "Indian Rupee", NZD: "New Zealand Dollar", SGD: "Singapore Dollar", HKD: "Hong Kong Dollar",
            KRW: "South Korean Won", MXN: "Mexican Peso", BRL: "Brazilian Real", ZAR: "South African Rand",
            SEK: "Swedish Krona", NOK: "Norwegian Krone", DKK: "Danish Krone", PLN: "Polish Zloty"
        };

        // Complete static fallback rates mapped relative to USD to guarantee instant render
        const fallbackRates = {
            USD: 1.0, EUR: 0.92, GBP: 0.79, CAD: 1.35, AUD: 1.52,
            JPY: 151.5, CHF: 0.90, CNY: 7.23, INR: 83.3, NZD: 1.65,
            SGD: 1.34, HKD: 7.82, KRW: 1350.0, MXN: 16.8, BRL: 5.05,
            ZAR: 18.5, SEK: 10.7, NOK: 10.8, DKK: 6.88, PLN: 4.01
        };

        let currentRates = {};
        let lastUpdatedStr = "";

        const amountInput = document.getElementById('amount');
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const swapBtn = document.getElementById('swapBtn');
        const rateText = document.getElementById('rateText');
        const convertedAmountEl = document.getElementById('convertedAmount');
        const timestampEl = document.getElementById('timestamp');

        function populateDropdowns() {
            const currencies = Object.keys(currencyNames).sort();
            currencies.forEach(code => {
                const opt1 = document.createElement('option');
                opt1.value = code;
                opt1.text = `${code} - ${currencyNames[code]}`;
                fromSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = code;
                opt2.text = `${code} - ${currencyNames[code]}`;
                toSelect.appendChild(opt2);
            });

            // Set default matching the design reference: EUR to CAD
            fromSelect.value = "EUR";
            toSelect.value = "CAD";
        }

        async function updateExchangeRates() {
            const base = fromSelect.value;
            try {
                // Using reliable open exchange rate API
                const response = await fetch(`https://open.er-api.com/v6/latest/${base}`);
                if (!response.ok) throw new Error('API request failed');
                const data = await response.json();
                
                if (data && data.rates) {
                    currentRates = data.rates;
                    lastUpdatedStr = data.time_last_update_utc ? data.time_last_update_utc.replace(' +0000', ' UTC') : new Date().toUTCString();
                } else {
                    throw new Error('Invalid data structure');
                }
            } catch (error) {
                console.warn("Using fallback exchange rates due to network/CORS limitation:", error);
                // Compute cross rates relative to base using fallback USD table
                const baseToUSD = 1 / (fallbackRates[base] || 1);
                currentRates = {};
                for (const [curr, rateAgainstUSD] of Object.entries(fallbackRates)) {
                    currentRates[curr] = rateAgainstUSD * baseToUSD;
                }
                lastUpdatedStr = "Cached Rate (Offline Mode)";
            }
            calculateConversion();
        }

        function calculateConversion() {
            const amount = parseFloat(amountInput.value);
            const from = fromSelect.value;
            const to = toSelect.value;

            if (isNaN(amount)) {
                convertedAmountEl.textContent = `0.00 ${to}`;
                return;
            }

            let rate = 1;
            if (currentRates[to]) {
                rate = currentRates[to];
            } else {
                rate = 1.0; // ultimate safety fallback
            }

            const result = amount * rate;

            rateText.textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;
            convertedAmountEl.textContent = `${result.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} ${to}`;
            timestampEl.textContent = `Last updated: ${lastUpdatedStr}`;
        }

        // Event bindings
        fromSelect.addEventListener('change', updateExchangeRates);
        toSelect.addEventListener('change', calculateConversion);
        amountInput.addEventListener('input', calculateConversion);

        swapBtn.addEventListener('click', () => {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            updateExchangeRates();
        });

        // Initialize on load
        window.onload = () => {
            populateDropdowns();
            updateExchangeRates();
        };
    </script>
</body>
</html>
```
